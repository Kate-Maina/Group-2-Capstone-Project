<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Sales Predictor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1em;
        }

        .content {
            padding: 30px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        select, input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        select:focus, input:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            font-family: monospace;
            min-height: 120px;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .help-text {
            font-size: 0.85em;
            color: #666;
            margin-top: 5px;
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .result {
            margin-top: 30px;
            padding: 25px;
            border-radius: 10px;
            display: none;
        }

        .result.success {
            background: #d4edda;
            border: 2px solid #28a745;
            display: block;
        }

        .result.error {
            background: #f8d7da;
            border: 2px solid #dc3545;
            display: block;
        }

        .result h3 {
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        .prediction-value {
            font-size: 2em;
            font-weight: bold;
            color: #28a745;
            margin: 10px 0;
        }

        .result-details {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(0,0,0,0.1);
        }

        .result-details p {
            margin: 5px 0;
            color: #555;
        }

        .loader {
            display: none;
            text-align: center;
            margin: 20px 0;
        }

        .loader.active {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .sample-btn {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 15px;
            background: #6c757d;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
        }

        .sample-btn:hover {
            background: #5a6268;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Weekly Sales Predictor</h1>
            <p>Predict sales for different stores using AI</p>
        </div>

        <div class="content">
            <form id="predictionForm">
                <div class="form-group">
                    <label for="shop">Select Shop:</label>
                    <select id="shop" required>
                        <option value="">-- Choose a shop --</option>
                        <option value="901 - Gikomba">901 - Gikomba</option>
                        <option value="904 - Kericho">904 - Kericho</option>
                        <option value="904.5 Meru WS">904.5 Meru WS</option>
                        <option value="905 - Eldoret">905 - Eldoret</option>
                        <option value="906 - Kisii">906 - Kisii</option>
                        <option value="907-Kisumu WS">907-Kisumu WS</option>
                        <option value="910 - Kitale">910 - Kitale</option>
                        <option value="913 -Kakamega WS">913 -Kakamega WS</option>
                        <option value="914-EMBU WS">914-EMBU WS</option>
                        <option value="915-NANYUKI WS">915-NANYUKI WS</option>
                        <option value="99 Warehouse">99 Warehouse</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="date">Prediction Date (Monday of week):</label>
                    <input type="date" id="date" required>
                    <div class="help-text">Select the Monday of the week you want to predict</div>
                </div>

                <div class="form-group">
                    <label for="salesHistory">Sales History (52 weeks):</label>
                    <textarea id="salesHistory" placeholder="Enter 52 weekly sales values separated by commas&#10;Example: 1500, 1600, 1450, 1700, ..." required></textarea>
                    <div class="help-text">Enter at least 52 weeks of historical sales data, separated by commas</div>
                    <button type="button" class="sample-btn" onclick="fillSampleData()">Use Sample Data</button>
                </div>

                <button type="submit" id="submitBtn">Predict Sales</button>
            </form>

            <div class="loader" id="loader">
                <div class="spinner"></div>
                <p>Calculating prediction...</p>
            </div>

            <div class="result" id="result"></div>
        </div>
    </div>

    <script>
        const API_URL = 'https://sheltered-eyrie-97374-879898d106db.herokuapp.com';

        function fillSampleData() {
            const sampleData = Array(52).fill(0).map(() => 
                Math.floor(Math.random() * 500) + 1500
            ).join(', ');
            document.getElementById('salesHistory').value = sampleData;
            
            const today = new Date();
            const nextMonday = new Date(today);
            nextMonday.setDate(today.getDate() + (8 - today.getDay()) % 7);
            document.getElementById('date').valueAsDate = nextMonday;
        }

        document.getElementById('predictionForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            console.log('Form submitted');

            const shop = document.getElementById('shop').value;
            const date = document.getElementById('date').value;
            const salesHistoryText = document.getElementById('salesHistory').value;

            console.log('Shop:', shop);
            console.log('Date:', date);

            const salesHistory = salesHistoryText.split(',').map(s => parseFloat(s.trim())).filter(n => !isNaN(n));
            console.log('Sales history length:', salesHistory.length);

            if (salesHistory.length < 52) {
                showResult('error', 'Error', `Please provide at least 52 weeks of sales data. You provided ${salesHistory.length} weeks.`);
                return;
            }

            const loader = document.getElementById('loader');
            const submitBtn = document.getElementById('submitBtn');
            const resultDiv = document.getElementById('result');

            loader.classList.add('active');
            submitBtn.disabled = true;
            resultDiv.style.display = 'none';

            try {
                console.log('Sending request...');
                const response = await fetch(`${API_URL}/predict`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        shop: shop,
                        date: date,
                        sales_history: salesHistory
                    })
                });

                console.log('Response status:', response.status);
                const data = await response.json();
                console.log('Response data:', data);

                if (data.success) {
                    const formattedSales = new Intl.NumberFormat('en-KE', {
                        style: 'currency',
                        currency: 'KES',
                        minimumFractionDigits: 2
                    }).format(data.predicted_sales);

                    console.log('Showing success result');
                    showResult('success', 'Prediction Successful', '', {
                        shop: data.shop,
                        date: data.prediction_date,
                        sales: formattedSales
                    });
                } else {
                    console.log('API returned error:', data.error);
                    showResult('error', 'Prediction Failed', data.error);
                }
            } catch (error) {
                console.error('Caught error:', error);
                showResult('error', 'Connection Error', 'Failed to connect to the API: ' + error.message);
            } finally {
                loader.classList.remove('active');
                submitBtn.disabled = false;
            }
        });

        function showResult(type, title, message, details = null) {
            const resultDiv = document.getElementById('result');
            resultDiv.className = `result ${type}`;
            resultDiv.style.display = 'block';

            if (type === 'success' && details) {
                resultDiv.innerHTML = `
                    <h3>${title}</h3>
                    <div class="prediction-value">${details.sales}</div>
                    <div class="result-details">
                        <p><strong>Shop:</strong> ${details.shop}</p>
                        <p><strong>Week Starting:</strong> ${new Date(details.date).toLocaleDateString('en-US', {weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'})}</p>
                    </div>
                `;
            } else {
                resultDiv.innerHTML = `
                    <h3>${title}</h3>
                    <p>${message}</p>
                `;
            }
        }

        window.onload = () => {
            const today = new Date();
            const nextMonday = new Date(today);
            const dayOfWeek = today.getDay();
            const daysUntilMonday = dayOfWeek === 0 ? 1 : (8 - dayOfWeek);
            nextMonday.setDate(today.getDate() + daysUntilMonday);
            document.getElementById('date').valueAsDate = nextMonday;
        };
    </script>
</body>
</html>
